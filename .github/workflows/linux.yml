name: Linux tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gcc dosfstools mtools libegl1 libgl1 libxkbcommon0
      - run: python -m pip install -r requirements.txt
      - run: python tools/build_cpu_helper_linux.py
      - run: mkdir -p /tmp/lumen-test-tools && ln -s "$(command -v mkfs.fat)" /tmp/lumen-test-tools/mkfs.fat && ln -s "$(command -v mcopy)" /tmp/lumen-test-tools/mcopy
      - run: python -B -m unittest discover -s tests_linux -t . -v
        env:
          QT_QPA_PLATFORM: offscreen
          LUMEN_TEST_IMAGE_TOOLS: /tmp/lumen-test-tools
